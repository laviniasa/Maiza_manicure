databases:
  - name: maiza-db
    plan: free
    region: virginia
    databaseName: maiza_db
    user: maiza_db_user
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: maiza-manicure
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maiza-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
